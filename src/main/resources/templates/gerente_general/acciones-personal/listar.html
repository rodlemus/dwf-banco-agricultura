<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acciones de Personal</title>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Acciones de Personal', userRole='GERENTE_GENERAL'">
    <section>
        <h2>Gestión de acciones de personal</h2>
        <p>Visualización y control de las acciones relacionadas al personal.</p>
        <!-- Aquí irá la lógica para ver/editar/gestionar personal -->

        <table border="1">
            <thead>
            <tr>
                <th>ID</th>
                <th>Empleado</th>
                <th>Creado por</th>
                <th>Tipo de Acción</th>
                <th>Revisado por</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="accion : ${acciones}">
                <td th:text="${accion.id}"></td>
                <td th:text="${accion.employee.email}"></td>
                <td th:text="${accion.createdBy.email}"></td>
                <td th:text="${accion.actionType}"></td>
                <td th:text="${accion.reviewedBy.name}"></td>
                <td th:text="${#temporals.format(accion.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

                <!-- Columna Estado y Acciones juntos en un solo <form> -->
                <td colspan="2">
                    <form th:action="@{/gerente-general/acciones-personal/actualizar}" method="post" th:id="'form-' + ${accion.id}">
                        <input type="hidden" name="id" th:value="${accion.id}" />

                        <select name="status"
                                th:id="'select-' + ${accion.id}"
                                th:onchange="'enableButton(' + ${accion.id} + ')'">
                            <option th:each="estado : ${statusValues}"
                                    th:value="${estado}"
                                    th:text="${#strings.capitalize(estado.name())}"
                                    th:selected="${accion.status == estado}">
                            </option>
                        </select>

                        <button type="submit" th:id="'btn-' + ${accion.id}" disabled>Actualizar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <br>
        <a th:href="@{/gerente-general}">Volver al panel principal</a>
    </section>
</div>

<script>
    // Estado original de cada select, para comparar y habilitar el botón solo si cambió
    const originalStatuses = {};

    document.addEventListener('DOMContentLoaded', () => {
        // Guardar estado original de cada select
        document.querySelectorAll('select[name="status"]').forEach(select => {
            originalStatuses[select.id] = select.value;
        });
    });

    function enableButton(id) {
        const select = document.getElementById('select-' + id);
        const button = document.getElementById('btn-' + id);

        // Habilitar el botón solo si el valor actual difiere del original
        if (select.value !== originalStatuses[select.id]) {
            button.disabled = false;
        } else {
            button.disabled = true;
        }
    }
</script>
</body>
</html>
