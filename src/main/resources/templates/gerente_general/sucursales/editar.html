<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Sucursal</title>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Editar Sucursal', userRole='GERENTE_GENERAL'">

    <section class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4">Editar Sucursal</h2>

        <form th:action="@{/gerente-general/sucursales/actualizar}" th:object="${sucursal}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Nombre:</label>
                <input type="text" id="name" th:field="*{name}" required
                       class="mt-1 px-4 py-2 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"/>
            </div>

            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Dirección:</label>
                <input type="text" id="address" th:field="*{location}" required
                       class="mt-1 px-4 py-2 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"/>
            </div>

            <div class="pt-4">
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition">
                    Guardar Cambios
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/gerente-general/sucursales}"
               class="text-indigo-600 hover:underline transition">← Volver a la lista</a>
        </div>
    </section>

</div>

</body>
</html>
