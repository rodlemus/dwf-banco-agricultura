<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Préstamos Solicitados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Préstamos Solicitados', userRole='cajero'">
    <section class="p-6 max-w-7xl mx-auto">
        <h2 class="text-2xl font-semibold text-blue-800 mb-2">Préstamos solicitados</h2>
        <p class="text-gray-600 mb-6">Lista de préstamos registrados por clientes.</p>

        <a th:href="@{/cajero/aperturar-prestamo}"
           class="inline-block bg-blue-700 text-white mb-4 px-5 py-2 rounded hover:bg-blue-800 transition">
            Agregar solicitud de préstamo
        </a>

        <div class="overflow-x-auto shadow border border-gray-200 rounded-lg">
            <table class="min-w-full text-sm text-left text-gray-700">
                <thead class="bg-blue-100 text-blue-800 uppercase text-xs font-semibold">
                <tr>
                    <th class="px-4 py-3">ID</th>
                    <th class="px-4 py-3">Cliente</th>
                    <th class="px-4 py-3">Monto Solicitado</th>
                    <th class="px-4 py-3">Interés (%)</th>
                    <th class="px-4 py-3">Pago Mensual</th>
                    <th class="px-4 py-3">Años</th>
                    <th class="px-4 py-3">Estado</th>
                    <th class="px-4 py-3">Fecha</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 bg-white">
                <tr th:each="prestamo : ${prestamos}" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-2" th:text="${prestamo.id}">1</td>
                    <td class="px-4 py-2" th:text="${prestamo.user.name}">Juan Pérez</td>
                    <td class="px-4 py-2" th:text="${prestamo.amountRequested}">$1000</td>
                    <td class="px-4 py-2" th:text="${prestamo.interestRate}">10</td>
                    <td class="px-4 py-2" th:text="${prestamo.monthlyPayment}">$100</td>
                    <td class="px-4 py-2" th:text="${prestamo.yearsToPay}">2</td>
                    <td class="px-4 py-2" th:text="${prestamo.status}">En espera</td>
                    <td class="px-4 py-2" th:text="${#temporals.format(prestamo.createdAt, 'yyyy-MM-dd HH:mm')}">2025-05-01</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
