<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aperturar Préstamo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Aperturar Préstamo', userRole='cajero'">
    <section class="max-w-3xl mx-auto p-6">
        <h2 class="text-2xl font-semibold text-blue-800 mb-2">Apertura de nuevo préstamo</h2>
        <p class="text-gray-600 mb-6">Formulario para abrir un nuevo préstamo para un cliente.</p>

        <form th:action="@{/cajero/agregar-solicitud-prestamo}" th:object="${prestamo}" method="post" class="space-y-5">
            <div>
                <label class="block mb-1 font-medium text-gray-700">Cliente:</label>
                <select th:field="*{user.id}" required
                        class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Seleccione un cliente</option>
                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.id}"
                            th:text="${cliente.name}">Cliente</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Monto solicitado:</label>
                <input type="number" th:field="*{amountRequested}" step="0.01" required
                       class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Tasa de interés (%):</label>
                <input type="number" th:field="*{interestRate}" step="0.01" required
                       class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Pago mensual:</label>
                <input type="number" th:field="*{monthlyPayment}" step="0.01" required
                       class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Años para pagar:</label>
                <input type="number" th:field="*{yearsToPay}" required
                       class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <button type="submit"
                        class="bg-blue-700 text-white font-semibold px-6 py-2 rounded-md hover:bg-blue-800 transition">
                    Solicitar préstamo
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/cajero/prestamos}"
               class="text-indigo-600 hover:underline transition">← Volver a la lista</a>
        </div>
    </section>
</div>
</body>
</html>
