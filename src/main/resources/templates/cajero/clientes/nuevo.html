<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Registrar Cliente', userRole='cajero'">
    <section class="p-6 max-w-xl mx-auto">
        <h2 class="text-2xl font-semibold text-blue-800 mb-2">Registrar nuevo cliente</h2>
        <p class="text-gray-600 mb-6">Formulario para registrar un nuevo cliente.</p>

        <form th:action="@{/cajero/guardar-cliente}" th:object="${cliente}" method="post"
              class="space-y-5 bg-white p-6 rounded-lg shadow-md">
            <div>
                <label class="block mb-1 font-medium text-gray-700">Nombre:</label>
                <input type="text" th:field="*{name}" required
                       class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Email:</label>
                <input type="email" th:field="*{email}" required
                       class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">DUI:</label>
                <input type="text" th:field="*{dui}" required
                       class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Contraseña:</label>
                <input type="password" th:field="*{password}" required
                       class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <button type="submit"
                        class="w-full bg-blue-800 text-white py-2 px-4 rounded hover:bg-blue-900 transition">
                    Registrar
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/cajero/clientes}"
               class="text-indigo-600 hover:underline transition">← Volver a la lista</a>
        </div>
    </section>
</div>
</body>
</html>
