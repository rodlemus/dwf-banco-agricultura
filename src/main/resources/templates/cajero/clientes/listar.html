<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Clientes Registrados', userRole='cajero'">
    <section class="p-6">
        <h2 class="text-2xl font-semibold text-blue-800 mb-2">Clientes registrados</h2>
        <p class="text-gray-600 mb-6">Listado de clientes registrados en el sistema.</p>

        <a th:href="@{/cajero/registrar-cliente}"
           class="inline-block bg-blue-800 text-white px-4 py-2 mb-4 rounded hover:bg-blue-900 transition">
            Registrar nuevo cliente
        </a>

        <div class="overflow-x-auto bg-white shadow rounded-lg">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-blue-800 text-white">
                <tr>
                    <th class="px-4 py-2 text-left text-sm font-semibold">ID</th>
                    <th class="px-4 py-2 text-left text-sm font-semibold">Nombre</th>
                    <th class="px-4 py-2 text-left text-sm font-semibold">Email</th>
                    <th class="px-4 py-2 text-left text-sm font-semibold">DUI</th>
                    <th class="px-4 py-2 text-left text-sm font-semibold">Estado</th>
                    <th class="px-4 py-2 text-left text-sm font-semibold">Fecha de creación</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="cliente : ${clientes}" class="hover:bg-gray-50">
                    <td class="px-4 py-2" th:text="${cliente.id}">1</td>
                    <td class="px-4 py-2" th:text="${cliente.name}">Nombre</td>
                    <td class="px-4 py-2" th:text="${cliente.email}">email@example.com</td>
                    <td class="px-4 py-2" th:text="${cliente.dui}">12345678-9</td>
                    <td class="px-4 py-2" th:text="${cliente.status}">activo</td>
                    <td class="px-4 py-2" th:text="${#temporals.format(cliente.createdAt, 'dd/MM/yyyy HH:mm')}">fecha</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
