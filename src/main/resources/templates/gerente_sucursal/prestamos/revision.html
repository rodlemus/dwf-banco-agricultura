<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Revisar Préstamos</title>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Revisar Préstamos', userRole='GERENTE_SUCURSAL'">
    <section>
        <h2>Revisión de solicitudes de préstamos</h2>
        <!-- <p>Listado de préstamos pendientes de aprobación.</p> -->
        <p>Lista de préstamos registrados por clientes.</p>
        <!-- Aquí se listarán los préstamos pendientes -->

        <table border="1">
            <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>DUI</th>
                <th>Monto Solicitado $</th>
                <th>Interés (%)</th>
                <th>Pago Mensual $</th>
                <th>Años</th>
                <th>Creado por</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prestamo : ${prestamos}">
                <td th:text="${prestamo.id}"></td>
                <td th:text="${prestamo.user.name}"></td>
                <td th:text="${prestamo.user.dui}"></td>
                <td th:text="${prestamo.amountRequested}"></td>
                <td th:text="${prestamo.interestRate}"></td>
                <td th:text="${prestamo.monthlyPayment}"></td>
                <td th:text="${prestamo.yearsToPay}"></td>
                <th th:text="${prestamo.createdBy.email}"></th>
                <td th:text="${#temporals.format(prestamo.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

                <!-- Columna Estado y Acciones juntos en un solo <form> -->
                <td colspan="2">
                    <form th:action="@{/gerente-sucursal/prestamos/actualizar-status}" method="post" th:id="'form-' + ${prestamo.id}">
                        <input type="hidden" name="id" th:value="${prestamo.id}" />

                        <select name="status"
                                th:id="'select-' + ${prestamo.id}"
                                th:onchange="'enableButton(' + ${prestamo.id} + ')'">
                            <option th:each="estado : ${statusValues}"
                                    th:value="${estado}"
                                    th:text="${#strings.capitalize(estado.name())}"
                                    th:selected="${prestamo.status == estado}">
                            </option>
                        </select>

                        <button type="submit" th:id="'btn-' + ${prestamo.id}" disabled>Actualizar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>

<script>
    // Estado original de cada select, para comparar y habilitar el botón solo si cambió
    const originalStatuses = {};

    document.addEventListener('DOMContentLoaded', () => {
        // Guardar estado original de cada select
        document.querySelectorAll('select[name="status"]').forEach(select => {
            originalStatuses[select.id] = select.value;
        });
    });

    function enableButton(id) {
        const select = document.getElementById('select-' + id);
        const button = document.getElementById('btn-' + id);

        // Habilitar el botón solo si el valor actual difiere del original
        if (select.value !== originalStatuses[select.id]) {
            button.disabled = false;
        } else {
            button.disabled = true;
        }
    }
</script>
</body>
</html>
