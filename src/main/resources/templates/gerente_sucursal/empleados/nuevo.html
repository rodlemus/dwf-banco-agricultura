<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Registrar Empleado</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Registrar Empleado', userRole='gerente_sucursal'">
    <section class="max-w-lg mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Registrar nuevo empleado</h2>
        <p class="mb-6 text-gray-600">Formulario para registrar un nuevo empleado.</p>

        <form th:action="@{/gerente-sucursal/registrar-empleado-nuevo}" method="post" th:object="${empleado}" class="space-y-4">
            <div>
                <label class="block mb-1 font-semibold text-gray-700">Nombre:</label>
                <input type="text" th:field="*{name}" required
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block mb-1 font-semibold text-gray-700">Email:</label>
                <input type="email" th:field="*{email}" required
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block mb-1 font-semibold text-gray-700">Contraseña:</label>
                <input type="password" th:field="*{password}" required
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block mb-1 font-semibold text-gray-700">DUI:</label>
                <input type="text" th:field="*{dui}" maxlength="10" required
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block mb-1 font-semibold text-gray-700">Salario:</label>
                <input type="number" th:field="*{salary}" step="0.01" required
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block mb-1 font-semibold text-gray-700">Rol:</label>
                <select th:field="*{role}" required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Seleccione un rol</option>
                    <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
                </select>
            </div>

            <div>
                <label class="block mb-1 font-semibold text-gray-700">Sucursal:</label>
                <select th:field="*{branch.id}" required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Seleccione una sucursal</option>
                    <option th:each="sucursal : ${sucursales}" th:value="${sucursal.id}" th:text="${sucursal.name}"></option>
                </select>
            </div>

            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                Registrar
            </button>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/gerente-sucursal/empleados}"
               class="text-indigo-600 hover:underline transition">← Volver a la lista</a>
        </div>
    </section>
</div>
</body>
</html>
