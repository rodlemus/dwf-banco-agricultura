<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movimientos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Mis movimientos', userRole='CLIENTE'">
    <section class="max-w-4xl mx-auto p-6">
        <h2 class="text-2xl font-semibold text-gray-800 mb-2">
            Movimientos de la cuenta: <span th:text="${cuenta.id}" class="text-blue-600"></span>
        </h2>
        <p class="text-gray-600 mb-6">Aquí se mostrarán los movimientos bancarios del cliente.</p>

        <div class="overflow-x-auto">
            <table class="min-w-full border border-gray-300 rounded-md">
                <thead class="bg-blue-700 text-white">
                <tr>
                    <th class="py-2 px-4 border-r border-blue-600">Tipo</th>
                    <th class="py-2 px-4 border-r border-blue-600">Monto</th>
                    <th class="py-2 px-4">Fecha</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="mov : ${movimientos}"
                    class="odd:bg-white even:bg-gray-50 hover:bg-blue-100 transition">
                    <td class="py-2 px-4 border border-blue-300" th:text="${mov.type}"></td>
                    <td class="py-2 px-4 border border-blue-300" th:text="${mov.amount}"></td>
                    <td class="py-2 px-4 border border-blue-300" th:text="${#temporals.format(mov.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6">
            <a th:href="@{/cliente/cuentas}"
               class="inline-block bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition">
                ← Volver a mis cuentas
            </a>
        </div>
    </section>
</div>
</body>
</html>
