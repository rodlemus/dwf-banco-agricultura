<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Buscar Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div th:replace="layout/base :: baseLayout(~{::section})"
     th:with="pageTitle='Buscar Cliente', userRole='DEPENDIENTE'">

    <section class="max-w-4xl mx-auto p-6">
        <h2 class="text-3xl font-semibold mb-6 text-gray-800">Buscar Cliente</h2>

        <form th:action="@{/dependiente/buscar-cliente}" method="post" class="mb-6 flex flex-col sm:flex-row items-center gap-4">
            <label for="dui" class="block text-gray-700 font-medium">Ingrese DUI del cliente:</label>
            <input type="text" name="dui" id="dui" required
                   class="border border-gray-300 rounded px-3 py-2 flex-grow focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="submit"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                Buscar
            </button>
        </form>

        <!-- Mostrar mensaje de error si no se encontró -->
        <div th:if="${error}" class="mb-6 text-red-600 font-semibold">
            <p th:text="${error}"></p>
        </div>

        <!-- Información del cliente encontrado -->
        <div th:if="${cliente}">
            <h3 class="text-xl font-semibold mb-3 text-gray-700">Información del Cliente</h3>
            <p><strong>Nombre:</strong> <span th:text="${cliente.name}" class="text-gray-900"></span></p>
            <p><strong>Email:</strong> <span th:text="${cliente.email}" class="text-gray-900"></span></p>
            <p><strong>DUI:</strong> <span th:text="${cliente.dui}" class="text-gray-900"></span></p>

            <!-- Cuentas Bancarias -->
            <h3 class="mt-6 mb-3 text-xl font-semibold text-gray-700">Cuentas Bancarias</h3>
            <div th:if="${cuentas != null and !cuentas.isEmpty()}">
                <table class="w-full border border-gray-300 rounded">
                    <thead class="bg-gray-200">
                    <tr>
                        <th class="border border-gray-300 px-4 py-2 text-left">Número de cuenta</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Saldo</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cuenta : ${cuentas}" class="odd:bg-white even:bg-gray-50">
                        <td class="border border-gray-300 px-4 py-2" th:text="${cuenta.id}"></td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${cuenta.balance}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${cuentas == null or cuentas.isEmpty()}" class="text-gray-600 italic">
                <p>Este cliente no tiene cuentas bancarias registradas.</p>
            </div>

            <!-- Préstamos -->
            <h3 class="mt-6 mb-3 text-xl font-semibold text-gray-700">Préstamos</h3>
            <div th:if="${prestamos != null and !prestamos.isEmpty()}">
                <table class="w-full border border-gray-300 rounded">
                    <thead class="bg-gray-200">
                    <tr>
                        <th class="border border-gray-300 px-4 py-2 text-left">Monto solicitado</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Interés (%)</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Pago mensual</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Años a pagar</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="prestamo : ${prestamos}" class="odd:bg-white even:bg-gray-50">
                        <td class="border border-gray-300 px-4 py-2" th:text="${prestamo.amountRequested}"></td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${prestamo.interestRate}"></td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${prestamo.monthlyPayment}"></td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${prestamo.yearsToPay}"></td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${prestamo.status}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${prestamos == null or prestamos.isEmpty()}" class="text-gray-600 italic">
                <p>Este cliente no tiene préstamos registrados.</p>
            </div>
        </div>
    </section>
</div>
</body>
</html>
