<div th:fragment="sidebar(role)">
    <nav class="flex flex-col space-y-2 text-sm">

        <ul class="space-y-2">
            <li>
                <a th:href="@{/home/dashboard}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Inicio
                </a>
            </li>

            <!-- Cliente -->
            <li th:if="${role == 'cliente'}">
                <a th:href="@{/cliente/cuentas}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Mis cuentas
                </a>
            </li>

            <!-- Dependiente -->
            <li th:if="${role == 'dependiente'}">
                <a th:href="@{/dependiente/atender-cliente}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Atender cliente
                </a>
            </li>
            <li th:if="${role == 'dependiente'}">
                <a th:href="@{/dependiente/buscar-cliente}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Información del Cliente
                </a>
            </li>

            <!-- Cajero -->
            <li th:if="${role == 'cajero'}">
                <a th:href="@{/cajero/clientes}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Clientes
                </a>
            </li>
            <li th:if="${role == 'cajero'}">
                <a th:href="@{/cajero/prestamos}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Préstamos
                </a>
            </li>

            <!-- Gerente de sucursal -->
            <li th:if="${role == 'gerente_sucursal'}">
                <a th:href="@{/gerente-sucursal/empleados}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Ver empleados
                </a>
            </li>
            <li th:if="${role == 'gerente_sucursal'}">
                <a th:href="@{/gerente-sucursal/revisar-prestamos}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Revisar préstamos
                </a>
            </li>

            <!-- Gerente general -->
            <li th:if="${role == 'gerente_general'}">
                <a th:href="@{/gerente-general/sucursales}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Nueva sucursal
                </a>
            </li>
            <li th:if="${role == 'gerente_general'}">
                <a th:href="@{/gerente-general/acciones-personal}" class="block px-4 py-2 rounded hover:bg-blue-700 transition">
                    Acciones de personal
                </a>
            </li>
        </ul>

        <div class="mt-6 border-t border-blue-700 pt-4">
            <a th:href="@{/auth/logout}" class="block px-4 py-2 rounded bg-red-600 hover:bg-red-700 text-white transition">
                Cerrar sesión
            </a>
        </div>

    </nav>
</div>
